<body data-page="landing">
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Blood Bowl Puzzles — home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="16" cy="16" rx="10" ry="13" fill="#e8e2d4" stroke="#0d1015" stroke-width="2"/>
        <path d="M16 6.5v19M11.5 11h9M11.5 16h9M11.5 21h9" stroke="#b03030" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Blood Bowl <b>Puzzles</b><small>by category</small></span>

  </div>
</footer>

<script>
(function () {
  var shown = false;
  function offerReload(msg) {
    if (shown) return;
    shown = true;
    var box = document.createElement('div');
    box.className = 'err-box small';
    box.style.cssText = 'position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:99;max-width:min(92vw,560px);background:#1a1315;box-shadow:0 10px 30px rgba(0,0,0,.5)';
    box.textContent = 'The page loaded an outdated script. Reload to pick up the current version. (' + String(msg || 'module error') + ') ';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-sm';
    btn.textContent = 'Reload';
    btn.style.marginLeft = '.5rem';
    btn.addEventListener('click', function () { location.reload(); });
    box.appendChild(btn);
    (document.body || document.documentElement).appendChild(box);
  }
  window.addEventListener('error', function (e) {
    var msg = (e && e.message) || '';
    if (/export named|dynamically imported module|module script failed/i.test(msg)) offerReload(msg);
  }, true);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
