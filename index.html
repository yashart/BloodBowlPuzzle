<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blood Bowl Puzzles — pick a set and play</title>
<meta name="description" content="Blood Bowl puzzles by category: pick a puzzle set and play.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1015">
<link rel="icon" href="images/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="landing">

<main class="wrap" id="app">
  <div class="center">
    <span class="spinner"></span>
    <p class="muted" style="margin-top:.6rem">Loading sets…</p>
  </div>
</main>

<script>
(function () {
  var shown = false;
  function offerReload(msg) {
    if (shown) return;
    shown = true;
    var box = document.createElement('div');
    box.className = 'err-box small';
    box.style.cssText = 'position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:99;max-width:min(92vw,560px);background:#1a1315;box-shadow:0 10px 30px rgba(0,0,0,.5)';
    box.textContent = 'The page loaded an outdated script. Reload to pick up the current version. (' + String(msg || 'module error') + ') ';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-sm';
    btn.textContent = 'Reload';
    btn.style.marginLeft = '.5rem';
    btn.addEventListener('click', function () { location.reload(); });
    box.appendChild(btn);
    (document.body || document.documentElement).appendChild(box);
  }
  window.addEventListener('error', function (e) {
    var msg = (e && e.message) || '';
    if (/export named|dynamically imported module|module script failed/i.test(msg)) offerReload(msg);
  }, true);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
